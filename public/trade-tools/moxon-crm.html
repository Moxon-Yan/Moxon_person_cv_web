<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moxon Flow · 西服定制外贸 CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f6f2ea; --copper:#b8732e; --copper-d:#9d5f24; --navy:#1c2b3a; --ink:#15171c;
  --card:#fffdf8; --line:rgba(21,23,28,.09); --line2:rgba(21,23,28,.05);
  --muted:rgba(21,23,28,.52); --faint:rgba(21,23,28,.36);
  --olive:#5c6b48; --brick:#a6483d; --slate:#6b7280; --sand:#efe7d8;
  --shadow:0 1px 0 0 rgba(21,23,28,.04),0 8px 24px -12px rgba(21,23,28,.12);
  --r:14px;
  --serif:'Fraunces',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.25}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
svg{width:1em;height:1em;vertical-align:-.16em;flex:none}
::placeholder{color:var(--faint)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(21,23,28,.16);border-radius:8px;border:2px solid var(--ivory)}
::-webkit-scrollbar-track{background:transparent}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:13px;border:1px solid var(--ink);transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.btn.copper{background:var(--copper);border-color:var(--copper)}
.btn.copper:hover{background:var(--copper-d)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:rgba(21,23,28,.25);background:#fff}
.btn.danger{background:transparent;color:var(--brick);border-color:rgba(166,72,61,.35)}
.btn.danger:hover{background:rgba(166,72,61,.07)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.2px;background:var(--sand);color:#6f5838;border:1px solid rgba(184,115,46,.18);white-space:nowrap}
.badge.ink{background:#eeece8;color:#3a3f47;border-color:rgba(21,23,28,.1)}
.badge.copper{background:#f6e9da;color:#8f5520;border-color:rgba(184,115,46,.3)}
.badge.navy{background:#e7ecf1;color:#2c4256;border-color:rgba(28,43,58,.18)}
.badge.olive{background:#e9ede1;color:#4c5a3b;border-color:rgba(92,107,72,.25)}
.badge.brick{background:#f5e5e1;color:#93402f;border-color:rgba(166,72,61,.25)}
.badge.slate{background:#edeeF1;color:#5b6572;border-color:rgba(107,114,128,.25)}
.grade{font-family:var(--mono);font-size:11px;font-weight:500;width:23px;height:23px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
.grade.A{background:#f6e9da;color:#8f5520}.grade.B{background:#e7ecf1;color:#2c4256}.grade.C{background:#eeece8;color:#6b656b}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:15.5px}
.card-b{padding:16px 18px}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:8.5px 11px;background:#fff;outline:none;transition:.15s;width:100%}
.field textarea{resize:vertical;min-height:64px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--copper);box-shadow:0 0 0 3px rgba(184,115,46,.13)}
.field .hint{font-size:11px;color:var(--faint);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.toolbar input[type=search]{min-width:220px}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:rgba(184,115,46,.05)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.empty{padding:46px 20px;text-align:center;color:var(--faint);font-size:13px}
.empty svg{width:30px;height:30px;margin-bottom:8px;display:block;margin-inline:auto;opacity:.5}
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:0 0 232px;background:var(--navy);color:#e9e4d8;display:flex;flex-direction:column;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:40}
.brand{font-family:var(--serif);font-size:21px;font-weight:600;padding:6px 12px 18px;letter-spacing:.2px;color:#f8f3e8}
.brand small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(233,228,216,.5);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:10px;color:rgba(233,228,216,.72);font-weight:500;font-size:13.5px}
.nav a svg{width:17px;height:17px;flex:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--copper);color:#fff}
.side-foot{margin-top:auto;padding:12px;font-size:11px;line-height:1.6;color:rgba(233,228,216,.42)}
.main{flex:1;margin-left:232px;padding:26px 30px 60px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:27px}
.page-sub{color:var(--muted);font-size:13px;margin-top:3px}
.mobbar{display:none}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.metric{padding:16px 18px}
.metric .k{font-size:12px;color:var(--muted);font-weight:600}
.metric .v{font-family:var(--serif);font-size:28px;font-weight:600;margin-top:7px;letter-spacing:-.3px}
.metric .v small{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--muted);margin-left:7px;letter-spacing:0}
.metric .sub{font-size:12px;color:var(--faint);margin-top:4px}
.metric .sub b{color:var(--copper);font-weight:600}
.metric .sub .danger{color:var(--brick);font-weight:700}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.legend{display:flex;gap:13px;font-size:11.5px;color:var(--muted);font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-svg{width:100%;height:auto;display:block}

.fun-row{display:grid;grid-template-columns:64px 1fr 88px;align-items:center;gap:10px;margin-bottom:11px}
.fun-lab{font-size:12.5px;font-weight:600}
.fun-track{height:21px;background:rgba(21,23,28,.05);border-radius:6px;overflow:hidden}
.fun-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:700;min-width:25px;transition:width .5s}
.fun-amt{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.sea-row{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.sea-name{width:64px;font-size:12.5px;font-weight:600}
.sea-track{flex:1;height:10px;background:rgba(21,23,28,.05);border-radius:6px;overflow:hidden}
.sea-fill{height:100%;border-radius:6px}
.sea-val{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:96px;text-align:right}

.tl{position:relative;padding-left:19px}
.tl:before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:1.5px;background:var(--line)}
.tl-item{position:relative;padding:0 0 15px}
.tl-item:last-child{padding-bottom:2px}
.tl-item:before{content:'';position:absolute;left:-18.5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--copper);border:2px solid var(--ivory)}
.tl-meta{font-size:11.5px;color:var(--faint);margin-bottom:2px;display:flex;gap:8px;align-items:center}
.tl-body{font-size:13px;line-height:1.5}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 246px;background:rgba(21,23,28,.035);border:1px solid var(--line2);border-radius:12px;padding:9px;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.col.drag{background:rgba(184,115,46,.1);border-color:var(--copper)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 9px}
.col-h .t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.col-dot{width:8px;height:8px;border-radius:50%}
.col-h .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.col-body{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:34px;padding-right:2px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);cursor:grab;transition:transform .12s,border-color .12s}
.kcard:hover{border-color:rgba(184,115,46,.45)}
.kcard.dragging{opacity:.45}
.kcard h4{font-family:var(--sans);font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.4}
.kcard .kc{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.kcard .amt{font-family:var(--mono);font-weight:500;color:var(--ink)}
.kcard .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.dormant{margin-bottom:16px}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px dashed rgba(166,72,61,.4);border-radius:10px;background:rgba(166,72,61,.035);margin-bottom:8px}
.ditem .days{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--brick);white-space:nowrap}
.ditem .di{flex:1;min-width:0;cursor:pointer}
.ditem h4{font-family:var(--sans);font-size:13px;font-weight:600}
.ditem .dm{font-size:11.5px;color:var(--muted)}

.mask{position:fixed;inset:0;background:rgba(21,23,28,.42);backdrop-filter:blur(2px);z-index:80;animation:fade .18s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:472px;max-width:94vw;background:var(--ivory);z-index:90;display:flex;flex-direction:column;box-shadow:-16px 0 48px -16px rgba(21,23,28,.35);animation:slidein .24s cubic-bezier(.32,.72,.24,1)}
.modal{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:580px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;background:var(--card);border-radius:16px;box-shadow:0 24px 70px -20px rgba(21,23,28,.5);animation:pop .2s}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.97);opacity:.5}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 22px;border-bottom:1px solid var(--line)}
.ov-h h3{font-size:17.5px}
.ov-b{padding:20px 22px;overflow-y:auto;flex:1}
.ov-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:rgba(246,242,234,.7);border-radius:0 0 16px 16px}
.x{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.x:hover{background:rgba(21,23,28,.07);color:var(--ink)}
.x svg{width:17px;height:17px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--faint)}
.kv dd{word-break:break-word}
.sec-t{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:700;margin:18px 0 9px;display:flex;align-items:center;gap:10px}
.sec-t:first-child{margin-top:0}
.sec-t:after{content:'';flex:1;height:1px;background:var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:3px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px}
.sub-card{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:8px;font-size:12.5px;cursor:pointer}
.sub-card:hover{border-color:rgba(184,115,46,.4)}
.sub-card .h{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px;margin-bottom:3px}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{flex:1}
.pw-wrap button{position:absolute;right:6px;color:var(--faint);padding:3px}
.pw-wrap svg{width:15px;height:15px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.fab{padding:15px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative}
.fab:hover{border-color:rgba(184,115,46,.4)}
.fab .code{font-family:var(--mono);font-size:11.5px;color:var(--copper);font-weight:500;letter-spacing:.4px}
.fab h4{font-family:var(--serif);font-size:16px}
.fab .meta{font-size:12px;color:var(--muted)}
.swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.14);display:inline-block}
.fab .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:9px;border-top:1px solid var(--line2)}
.colorrow{display:flex;gap:5px;align-items:center}
.fdel{position:absolute;top:10px;right:10px;color:var(--faint);padding:4px;border-radius:7px}
.fdel:hover{color:var(--brick);background:rgba(166,72,61,.08)}
.fdel svg{width:15px;height:15px}

.tasks-wrap{display:grid;grid-template-columns:1.3fr .95fr;gap:14px;align-items:start}
.task{display:flex;align-items:flex-start;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:none}
.task.done .tt{color:var(--faint);text-decoration:line-through}
.cbox{width:18px;height:18px;border-radius:6px;border:1.8px solid rgba(21,23,28,.25);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;background:#fff;transition:.13s;cursor:pointer}
.cbox.on{background:var(--copper);border-color:var(--copper);color:#fff}
.cbox svg{width:12px;height:12px}
.task .tt{font-size:13.5px;font-weight:500;flex:1}
.task .tm{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task.over .due{color:var(--brick);font-weight:700}
.tgrp{margin-bottom:14px;overflow:hidden}
.tgrp:last-child{margin-bottom:0}
.tgrp-h{padding:11px 16px;font-size:12.5px;font-weight:700;background:rgba(21,23,28,.03);border-bottom:1px solid var(--line2);display:flex;justify-content:space-between}
.tx{color:var(--faint);padding:4px;border-radius:7px}
.tx:hover{color:var(--brick);background:rgba(166,72,61,.08)}
.cal{padding:14px 16px 16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--faint);font-weight:600;padding:4px 0}
.cal-cell{min-height:61px;border:1px solid var(--line2);border-radius:8px;padding:4px 5px;background:#fff;font-size:11px}
.cal-cell.off{background:rgba(21,23,28,.025)}
.cal-cell.today{border-color:var(--copper);box-shadow:inset 0 0 0 1px var(--copper)}
.cal-cell .d{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:3px}
.cal-ev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;padding:1px 5px;border-radius:4px;margin-bottom:2px;background:#f1e7d6;color:#7d5526;font-weight:500}
.cal-ev.done{background:#eceae5;color:var(--faint);text-decoration:line-through}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 0;border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-row h4{font-size:14.5px;font-family:var(--sans);font-weight:600}
.set-row p{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat-chips{display:flex;gap:20px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stat-chips b{color:var(--ink);font-family:var(--mono);font-weight:500;margin-left:4px}

#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);animation:pop .2s}
.toast.err{background:var(--brick)}
.boot{padding:40px;color:var(--faint);font-family:var(--serif)}

@media (max-width:1020px){
  .metrics{grid-template-columns:1fr 1fr}
  .grid2,.grid2b,.tasks-wrap{grid-template-columns:1fr}
}
@media (max-width:760px){
  .side{display:none}
  .main{margin-left:0;padding:16px 14px 86px}
  .page-title{font-size:22px}
  .topbar{align-items:stretch}
  .toolbar{width:100%}
  .toolbar input[type=search]{min-width:0;flex:1}
  .mobbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(28,43,58,.97);backdrop-filter:blur(8px);z-index:60;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08)}
  .mobbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:rgba(233,228,216,.6);padding:4px 10px;border-radius:9px}
  .mobbar a.on{color:#fff}
  .mobbar svg{width:19px;height:19px}
  .row2,.row3{grid-template-columns:1fr}
  .drawer{width:100%}
  .tbl-wrap{overflow-x:auto}
}
</style>
</head>
<body>
<div id="app"><div class="boot">Moxon Flow…</div></div>
<div id="overlay-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
/* ============== 常量 ============== */
const STAGES=[
 {k:'inquiry',l:'新询盘',tone:'navy'},{k:'quoted',l:'已报价',tone:'copper'},
 {k:'negotiating',l:'谈判中',tone:'ink'},{k:'closed',l:'已成交',tone:'olive'},
 {k:'shipped',l:'已发货',tone:'slate'},{k:'done',l:'已完成',tone:'olive'},
 {k:'lost',l:'已流失',tone:'brick'}];
const STAGE={};STAGES.forEach(x=>STAGE[x.k]=x);
const SRC={alibaba:'阿里巴巴',exhibition:'展会',email:'主动邮件',referral:'老客户转介',website:'独立站',social:'社媒',outbound:'主动开发',other:'其他'};

const LS_KEY='moxon-flow-html-v1';
let DB;
function loadDB(){try{const r=localStorage.getItem(LS_KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.customers)&&Array.isArray(d.pipelines))return d;}}catch(e){}return seedDB();}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){toast('本地存储失败：'+e.message,true);}}
function commit(){save();render();}
const nowIso=()=>new Date().toISOString();
function getC(id){return DB.customers.find(c=>c.id===id);}
function getF(id){return DB.fabrics.find(f=>f.id===id);}
function getP(id){return DB.pipelines.find(p=>p.id===id);}

function addCustomer(o){const t=nowIso();DB.customers.unshift(Object.assign({remark:'',storeUsername:'',storePassword:'',shippingAddress:''},o,{id:uid('cus'),createdAt:t,lastContactAt:t}));}
function updateCustomer(id,patch){const c=getC(id);if(c)Object.assign(c,patch);}
function touchCustomer(id){updateCustomer(id,{lastContactAt:nowIso()});toast('已记录本次联系');}
function delCustomer(id){
 DB.customers=DB.customers.filter(c=>c.id!==id);
 DB.contacts=DB.contacts.filter(c=>c.customerId!==id);
 DB.pipelines=DB.pipelines.filter(p=>p.customerId!==id);
 DB.tasks=DB.tasks.filter(t=>t.customerId!==id);
 DB.activities=DB.activities.filter(a=>a.customerId!==id);
}
function addContact(o){DB.contacts.unshift(Object.assign({isPrimary:false},o,{id:uid('ct')}));}
function delContact(id){DB.contacts=DB.contacts.filter(c=>c.id!==id);}
function addPipeline(o){const t=nowIso();const p=Object.assign({description:'',patternNo:'',sampleStatus:'none',craftOptions:{}},o,{id:uid('pip'),createdAt:t,stageChangedAt:t});DB.pipelines.unshift(p);return p.id;}
function updatePipeline(id,patch){const p=getP(id);if(p)Object.assign(p,patch);}
function moveStage(id,stage){
 const p=getP(id);if(!p||p.stage===stage)return;const from=p.stage,t=nowIso();
 p.stage=stage;p.stageChangedAt=t;
 DB.activities.unshift({id:uid('act'),customerId:p.customerId,pipelineId:p.id,type:'stage_change',content:`阶段由「${STAGE[from].l}」变更为「${STAGE[stage].l}」`,createdAt:t});
}
function reactivate(id){const p=getP(id);if(!p)return;const t=nowIso();p.stageChangedAt=t;DB.activities.unshift({id:uid('act'),customerId:p.customerId,pipelineId:p.id,type:'note',content:'重新激活休眠询盘',createdAt:t});}
function delPipeline(id){
 DB.pipelines=DB.pipelines.filter(p=>p.id!==id);
 DB.activities=DB.activities.filter(a=>a.pipelineId!==id);
 DB.tasks=DB.tasks.filter(t=>t.pipelineId!==id);
}
let DORM=[];
function computeDormant(){
 const last={};DB.activities.forEach(a=>{if(a.pipelineId&&(!last[a.pipelineId]||a.createdAt>last[a.pipelineId]))last[a.pipelineId]=a.createdAt;});
 const n=Date.now();
 return DB.pipelines.filter(p=>p.stage==='inquiry').map(p=>{const lt=last[p.id]||p.stageChangedAt;return{p,lt,days:Math.floor((n-new Date(lt).getTime())/864e5)};}).filter(x=>x.days>21).sort((a,b)=>a.lt.localeCompare(b.lt));
}
function ensureDormantTasks(items){
 let added=0;const t=nowIso();
 [7,15,30].forEach(cp=>items.forEach(d=>{
  if(d.days<cp)return;
  if(DB.tasks.some(x=>x.kind==='dormant_followup'&&x.pipelineId===d.p.id&&x.dormantDays===cp))return;
  const due=new Date();due.setDate(due.getDate()+Math.max(1,cp-d.days));
  DB.tasks.unshift({id:uid('tsk'),customerId:d.p.customerId,pipelineId:d.p.id,title:`休眠激活跟进（${d.p.title}）· 第 ${cp} 天触达`,priority:cp>=30?'high':cp>=15?'medium':'low',dueDate:due.toISOString(),done:false,createdAt:t,kind:'dormant_followup',dormantDays:cp});
  added++;
 }));
 return added;
}
function addFabric(o){DB.fabrics.unshift(Object.assign({remark:'',colors:[]},o,{id:uid('fab'),createdAt:nowIso()}));}
function updateFabric(id,patch){const f=getF(id);if(f)Object.assign(f,patch);}
function delFabric(id){DB.fabrics=DB.fabrics.filter(f=>f.id!==id);}
function addTask(o){DB.tasks.unshift(Object.assign({done:false,priority:'medium'},o,{id:uid('tsk'),createdAt:nowIso()}));}
function toggleTask(id){const t=DB.tasks.find(x=>x.id===id);if(t)t.done=!t.done;}
function delTask(id){DB.tasks=DB.tasks.filter(t=>t.id!==id);}
function addActivity(o){DB.activities.unshift(Object.assign({},o,{id:uid('act'),createdAt:nowIso()}));}
function resetDB(){DB=seedDB();save();}

/* ============== 图表 ============== */
function trendChart(t){
 const W=580,H=214,PL=38,PR=14,PT=14,PB=28,iw=W-PL-PR,ih=H-PT-PB;
 const mc=Math.max(1,...t.map(x=>Math.max(x.inquiry,x.quoted,x.closed)));
 const ma=Math.max(1,...t.map(x=>x.amount));
 let grid='';
 for(let i=0;i<=4;i++){const y=PT+ih-i*ih/4;grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(21,23,28,.07)"/>`;}
 const cols=['#9fb6cc','#b8732e','#5c6b48'];
 const gw=iw/t.length,bw=9;
 const pts=[];
 let bars='';
 t.forEach((x,i)=>{
  const cx=PL+gw*i+gw/2;
  [x.inquiry,x.quoted,x.closed].forEach((v,j)=>{
   const h2=v/mc*ih,bx=cx-16+j*11.5,by=PT+ih-h2;
   bars+=`<rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(0,h2)}" rx="2" fill="${cols[j]}"><title>${x.month} · ${['新询盘','推进中','已成交'][j]}：${v} 单</title></rect>`;
  });
  const ay=PT+ih-x.amount/ma*ih;pts.push([cx+3.5,ay]);
  bars+=`<circle cx="${cx+3.5}" cy="${ay}" r="3" fill="#1c2b3a"><title>${x.month} · 成交额：${money(x.amount)}</title></circle>`;
  bars+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="rgba(21,23,28,.52)">${x.month}</text>`;
 });
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}<path d="${line}" fill="none" stroke="#1c2b3a" stroke-width="1.5" stroke-dasharray="3 3" opacity=".65"/>${bars}</svg>`;
}
const TONE_C={navy:'#33506b',copper:'#b8732e',ink:'#3a3f47',olive:'#5c6b48',slate:'#7d8794',brick:'#a6483d'};
function funnelHtml(rows){
 const max=Math.max(1,...rows.map(x=>x.amount));
 return rows.map(x=>`<div class="fun-row"><div class="fun-lab">${x.label}</div><div class="fun-track"><div class="fun-fill" style="width:${Math.max(8,x.amount/max*100)}%;background:${TONE_C[x.tone]}">${x.count}</div></div><div class="fun-amt">${money(x.amount)}</div></div>`).join('');
}
function timelineHtml(list,limit){
 return `<div class="tl">${list.slice(0,limit||20).map(a=>{
  const who=a.customerId?getC(a.customerId)?.company:'';
  return `<div class="tl-item"><div class="tl-meta">${badge(ACT_LAB[a.type]||'备注','slate')}${who?`<span>${esc(who)}</span>`:''}<span>${rel(a.createdAt)}</span></div><div class="tl-body">${esc(a.content)}</div></div>`;
 }).join('')||empty('暂无动态记录','clock')}</div>`;
}

/* ============== 工作台统计 ============== */
function dashStats(){
 const now=new Date(),ym=dfull(now).slice(0,7);
 const active=DB.pipelines.filter(p=>p.stage!=='done'&&p.stage!=='lost');
 const closedSet=['closed','shipped','done'];
 const closedThis=DB.pipelines.filter(p=>closedSet.includes(p.stage)&&dfull(p.stageChangedAt).slice(0,7)===ym);
 const months=[];
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:`${d.getMonth()+1}月`});}
 const trend=months.map(m=>{
  const inq=DB.pipelines.filter(p=>dfull(p.createdAt).slice(0,7)===m.key&&p.stage==='inquiry').length;
  const quo=DB.pipelines.filter(p=>dfull(p.createdAt).slice(0,7)===m.key&&p.stage!=='inquiry'&&p.stage!=='lost').length;
  const clo=DB.pipelines.filter(p=>closedSet.includes(p.stage)&&dfull(p.stageChangedAt).slice(0,7)===m.key);
  return {month:m.label,inquiry:inq,quoted:quo,closed:clo.length,amount:clo.reduce((s,p)=>s+p.amount,0)};
 });
 const funnel=STAGES.filter(s=>s.k!=='lost').map(s=>{
  const list=DB.pipelines.filter(p=>p.stage===s.k);
  return {key:s.k,label:s.l,tone:s.tone,count:list.length,amount:list.reduce((x,p)=>x+p.amount,0)};
 });
 const fmap=new Map(DB.fabrics.map(f=>[f.id,f]));
 const season={spring_summer:{c:0,a:0},autumn_winter:{c:0,a:0},all_season:{c:0,a:0}};
 DB.pipelines.filter(p=>closedSet.includes(p.stage)).forEach(p=>{const f=p.fabricId?fmap.get(p.fabricId):null;if(f&&season[f.season]){season[f.season].c++;season[f.season].a+=p.amount;}});
 const pending=DB.tasks.filter(t=>!t.done);
 const today0v=dayMs(now);
 return {
  customerTotal:DB.customers.length,
  newCust:DB.customers.filter(c=>dfull(c.createdAt).slice(0,7)===ym).length,
  activeCount:active.length,activeAmount:active.reduce((s,p)=>s+p.amount,0),
  closedAmount:closedThis.reduce((s,p)=>s+p.amount,0),closedCount:closedThis.length,
  pending:pending.length,overdue:pending.filter(t=>dayMs(new Date(t.dueDate))<today0v).length,
  trend,funnel,season,
  recent:[...DB.activities].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,8)
 };
}

 </div>

let dormantOpen=true;
function viewPipeline(){
 const dormantIds=new Set(DORM.map(x=>x.p.id));
 const actions=`<button class="btn copper" onclick="pipelineForm()">${svg('plus')}新建商机</button>`;
 const cols=STAGES.map(s=>{
  const items=DB.pipelines.filter(p=>p.stage===s.k&&!(s.k==='inquiry'&&dormantIds.has(p.id))).sort((a,b)=>b.stageChangedAt.localeCompare(a.stageChangedAt));
  return `<div class="col"><div class="col-h"><div class="t"><span class="col-dot" style="background:${TONE_C[s.tone]}"></span>${s.l}</div><span class="n">${items.length} · ${money(items.reduce((x,p)=>x+p.amount,0))}</span></div><div class="col-body" data-stage="${s.k}">${items.map(pcard).join('')||''}</div></div>`;
 }).join('');
 const dhtml=DORM.length?DORM.map(d=>{const c=getC(d.p.customerId);return `<div class="ditem"><span class="days">${d.days} 天未跟进</span><div class="di" onclick="openPipeline('${d.p.id}')"><h4>${esc(d.p.title)}</h4><div class="dm">${esc(c?c.company:'—')} · ${money(d.p.amount)} · ${d.p.quantity} 套 · 询盘自 ${dfull(d.p.stageChangedAt)}</div></div><button class="btn ghost sm" onclick="wakePipeline('${d.p.id}')">${svg('refresh')}激活</button></div>`;}).join('')
  :`<div class="muted" style="font-size:12.5px;padding:6px 2px">暂无休眠询盘，所有询盘都在 21 天内有跟进。</div>`;
 return head('销售管道','拖拽卡片即可更新阶段 · 询盘超过 21 天无跟进自动进入休眠池',actions)+
 `<div class="card dormant"><div class="card-h" style="cursor:pointer" onclick="toggleDormant()"><h3>${svg('alert')} 休眠询盘 · ${DORM.length} 条 <span class="faint" style="font-size:11px;font-weight:400">（自动生成 7/15/30 天跟进待办）</span></h3><span class="faint">${dormantOpen?'收起':'展开'}</span></div><div class="card-b" style="${dormantOpen?'':'display:none'}" id="dormantBody">${dhtml}</div></div>
 <div class="board">${cols}</div>`;
}
function pcard(p){
 const c=getC(p.customerId);const f=p.fabricId?getF(p.fabricId):null;
 const days=Math.floor((Date.now()-new Date(p.stageChangedAt).getTime())/864e5);
 return `<div class="kcard" data-id="${p.id}" onclick="openPipeline('${p.id}')">
  <h4>${esc(p.title)}</h4>
  <div class="muted" style="font-size:11.5px">${esc(c?c.company:'—')}</div>
  <div class="kc"><span class="amt">${money(p.amount)}</span><span>${p.quantity} 套</span></div>
  <div class="tags">
   ${p.sampleStatus&&p.sampleStatus!=='none'?badge(SAMPLE[p.sampleStatus][0],SAMPLE[p.sampleStatus][1]):''}
   ${f?badge(f.code,'slate'):''}
   <span class="badge slate">${days}d</span>
  </div>
 </div>`;
}
function toggleDormant(){dormantOpen=!dormantOpen;const b=$('#dormantBody');if(b)b.style.display=dormantOpen?'':'none';render();}
function wakePipeline(id){reactivate(id);save();toast('询盘已激活，休眠跟进池已更新');render();}
function bindBoard(){
 const board=$('.board');if(!board)return;
 board.querySelectorAll('.kcard').forEach(card=>{
  card.draggable=true;
  card.ondragstart=e=>{e.dataTransfer.setData('text/plain',card.dataset.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging');};
  card.ondragend=()=>{card.classList.remove('dragging');board.querySelectorAll('.col').forEach(x=>x.classList.remove('drag'));};
  card.onclick=()=>openPipeline(card.dataset.id);
 });
 board.querySelectorAll('.col-body').forEach(b=>{
  b.ondragover=e=>{e.preventDefault();b.closest('.col').classList.add('drag');};
  b.ondragleave=e=>{if(!b.contains(e.relatedTarget))b.closest('.col').classList.remove('drag');};
  b.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');const st=b.dataset.stage;const p=getP(id);if(p&&p.stage!==st){moveStage(id,st);save();render();openPipeline(id);toast('已移动到「'+STAGE[st].l+'」');}};
 });
}

 const acts=DB.activities.filter(a=>a.pipelineId===id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 const co=p.craftOptions||{};
 const coChips=Object.keys(co).map(k=>`<span class="pill">${(CRAFT[k]?CRAFT[k][0]:k)}：${esc(co[k])}</span>`).join('');
 const body=`
 <dl class="kv">
  <dt>所属客户</dt><dd>${c?esc(c.company):'<span class="faint">已删除</span>'}</dd>
  <dt>当前阶段</dt><dd><select onchange="changeStage('${id}',this.value)" style="border:1px solid var(--line);border-radius:8px;padding:5px 9px">${STAGES.map(s=>`<option value="${s.k}"${p.stage===s.k?' selected':''}>${s.l}</option>`).join('')}</select></dd>

  <dt>阶段更新</dt><dd>${rel(p.stageChangedAt)}</dd>
  ${p.description?`<dt>需求描述</dt><dd style="white-space:pre-line">${esc(p.description)}</dd>`:''}
 </dl>
 <div class="sec-t">工艺选项</div>
 <div class="chips">${coChips||'<span class="faint" style="font-size:12.5px">未指定工艺</span>'}</div>
 <div class="sec-t">关联待办 · ${tasks.length}</div>
 ${tasks.map(t=>`<div class="sub-card" style="cursor:default;display:flex;align-items:center;gap:9px"><span class="cbox ${t.done?'on':''}" style="margin-top:0" onclick="doToggleTask('${t.id}','${id}')">${t.done?svg('check'):''}</span><div style="flex:1"><div class="${t.done?'muted':''}" style="font-size:12.5px;${t.done?'text-decoration:line-through':''}">${esc(t.title)}</div><div class="muted" style="font-size:11px">${ddate(t.dueDate)} · ${PRIO[t.priority][0]}</div></div></div>`).join('')||'<div class="faint" style="font-size:12.5px">暂无关联待办</div>'}
 <div class="sec-t">商机动态 · ${acts.length}</div>
 ${timelineHtml(acts,30)}
 <form onsubmit="savePipeActivity(event,'${id}')" style="margin-top:14px">
  <div class="field"><select name="type"><option value="note">备注</option><option value="email">邮件</option><option value="call">电话</option><option value="visit">拜访</option><option value="quote">报价</option></select></div>
  <div class="field"><textarea name="content" placeholder="记录该商机的跟进内容…" required></textarea></div>
  <button class="btn sm" type="submit">${svg('plus')}添加动态</button>
 </form>`;
 const footer=`<button class="btn ghost" onclick="pipelineForm('${id}')">${svg('settings')}编辑商机</button><button class="btn danger" onclick="removePipeline('${id}')">${svg('trash')}删除</button>`;
 openDrawer(p.title,stageBadge(p.stage),body,footer);
}

let calCur=new Date();
function viewTasks(){
 const actions=`<button class="btn copper" onclick="taskForm()">${svg('plus')}新建待办</button>`;
 const t0=dayMs(new Date());
 const pending=DB.tasks.filter(t=>!t.done).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
 const overdue=pending.filter(t=>dayMs(new Date(t.dueDate))<t0);
 const today=pending.filter(t=>dayMs(new Date(t.dueDate))===t0);
 const future=pending.filter(t=>dayMs(new Date(t.dueDate))>t0);
 const done=DB.tasks.filter(t=>t.done).sort((a,b)=>b.dueDate.localeCompare(a.dueDate));
 const grp=(title,list,over)=>`<div class="card tgrp"><div class="tgrp-h"><span>${title}</span><span>${list.length}</span></div>${list.map(t=>taskRow(t,over)).join('')||empty('暂无任务','check')}</div>`;
 return head('待办任务','逾期任务请优先处理 · 右侧日历查看全月排布',actions)+
 `<div class="tasks-wrap">
  <div>${grp('已逾期',overdue,true)}${grp('今天',today)}${grp('即将到期',future)}${grp('已完成',done)}</div>
  <div class="card"><div class="cal">${calHtml()}</div></div>
 </div>`;
}
function taskRow(t,over){
 const c=t.customerId?getC(t.customerId):null;
 return `<div class="task ${t.done?'done':''} ${over?'over':''}">
  <span class="cbox ${t.done?'on':''}" onclick="doTaskToggle('${t.id}')">${t.done?svg('check'):''}</span>
  <div style="flex:1;min-width:0"><div class="tt">${esc(t.title)}</div>
  <div class="tm">${prioBadge(t.priority)}<span class="due">${dfull(t.dueDate)} · ${rel(t.dueDate)}</span>${c?`<span>${esc(c.company)}</span>`:''}${t.kind==='dormant_followup'?badge('休眠跟进','brick'):''}</div></div>
  <button class="tx" onclick="removeTask('${t.id}')">${svg('trash')}</button></div>`;
}
function doTaskToggle(id){toggleTask(id);commit();}
function removeTask(id){delTask(id);commit();toast('待办已删除');}
function calMove(n){calCur.setMonth(calCur.getMonth()+n);render();}
function calHtml(){
 const y=calCur.getFullYear(),m=calCur.getMonth();
 const off=(new Date(y,m,1).getDay()+6)%7;
 const dim=new Date(y,m+1,0).getDate();
 const t0=dayMs(new Date());
 const pad=n=>String(n).padStart(2,'0');
 let cells='';
 for(let i=0;i<off;i++)cells+='<div class="cal-cell off"></div>';
 for(let d=1;d<=dim;d++){
  const ds=`${y}-${pad(m+1)}-${pad(d)}`;
  const evs=DB.tasks.filter(t=>dstr(t.dueDate)===ds).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const isToday=new Date(y,m,d).getTime()===t0;
  cells+=`<div class="cal-cell${isToday?' today':''}"><div class="d">${d}</div>${evs.slice(0,3).map(t=>`<div class="cal-ev ${t.done?'done':''}" title="${esc(t.title)}">${esc(t.title.length>7?t.title.slice(0,7)+'…':t.title)}</div>`).join('')}${evs.length>3?`<div class="cal-ev" style="background:#e7ecf1;color:#567">+${evs.length-3} 更多</div>`:''}</div>`;
 }
 return `<div class="cal-h"><button class="btn ghost sm" onclick="calMove(-1)">${svg('chevL')}</button><h3>${y} 年 ${m+1} 月</h3><button class="btn ghost sm" onclick="calMove(1)">${svg('chevR')}</button></div>
 <div class="cal-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>`;
}
function taskForm(){
 const pipOpts='<option value="">不关联商机</option>'+DB.pipelines.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('');
 const body=`<form id="tf">
  <div class="field"><label>任务内容 *</label><input name="title" required placeholder="例如：跟进 PI 回签进度"></div>
  <div class="row2">
   <div class="field"><label>优先级</label><select name="priority">${Object.keys(PRIO).map(k=>`<option value="${k}"${k==='medium'?' selected':''}>${PRIO[k][0]}</option>`).join('')}</select></div>
   <div class="field"><label>截止日期 *</label><input name="dueDate" type="date" required value="${dfull(new Date().toISOString())}"></div>
  </div>
  <div class="field"><label>关联商机（自动关联客户）</label><select name="pipelineId">${pipOpts}</select></div>
 </form>`;
 openModal('新建待办',body,`<button class="btn ghost" onclick="closeOverlay()">取消</button><button class="btn copper" onclick="submitTask()">创建待办</button>`);
}
function submitTask(){
 const f=$('#tf');if(!f.reportValidity())return;const v=fd(f);
 let customerId='';
 if(v.pipelineId){const p=getP(v.pipelineId);if(p)customerId=p.customerId;}
 addTask({title:v.title,priority:v.priority,dueDate:new Date(v.dueDate+'T09:00:00').toISOString(),done:false,pipelineId:v.pipelineId||'',customerId});
 closeOverlay();commit();toast('待办已创建');
}

/* ============== 设置 ============== */
function viewSettings(){
 const s=`<span>客户<b>${DB.customers.length}</b></span><span>商机<b>${DB.pipelines.length}</b></span><span>面料<b>${DB.fabrics.length}</b></span><span>联系人<b>${DB.contacts.length}</b></span><span>待办<b>${DB.tasks.length}</b></span><span>动态<b>${DB.activities.length}</b></span>`;
 const row=(h,p,btns)=>`<div class="set-row"><div><h4>${h}</h4><p>${p}</p></div><div class="toolbar">${btns}</div></div>`;
 return head('设置','单文件版数据全部保存在当前浏览器 localStorage（键：moxon-flow-html-v1）')+
 `<div class="card" style="padding:6px 20px"><div class="stat-chips">${s}</div></div>
 <div class="card" style="padding:8px 20px;margin-top:14px">
  ${row('导出数据','下载完整 JSON 备份，可用于迁移浏览器或存档。',`<button class="btn" onclick="exportData()">${svg('layers')}导出 JSON</button>`)}
  ${row('导入数据','选择此前导出的 JSON 文件，将覆盖当前全部数据。',`<label class="btn ghost">${svg('refresh')}选择文件导入<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label>`)}
  ${row('重置为示例数据','清空当前数据并恢复内置 6 位客户 / 8 个商机演示数据。',`<button class="btn danger" onclick="doReset()">${svg('trash')}重置数据</button>`)}
 </div>
 <div class="card" style="margin-top:14px"><div class="card-b muted" style="font-size:12.5px;line-height:1.9">
  Moxon Flow 单文件版 · 纯 HTML/CSS/JavaScript 实现，无框架、无后端、无网络请求（字体除外）。<br>
  直接双击文件即可使用，也可整体内嵌到个人网站中。清除浏览器站点数据会丢失记录，请定期导出备份。
 </div></div>`;
}
function exportData(){
 const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='moxon-flow-backup-'+dfull(new Date().toISOString())+'.json';
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
 toast('备份文件已开始下载');
}
function importData(inp){
 const f=inp.files[0];if(!f)return;
 f.text().then(t=>{
  try{
   const d=JSON.parse(t);
   if(!d.customers||!d.pipelines||!d.fabrics||!d.tasks||!d.activities)throw new Error('bad');
   DB={customers:d.customers,contacts:d.contacts||[],pipelines:d.pipelines,fabrics:d.fabrics,tasks:d.tasks,activities:d.activities};
   save();closeOverlay();render();toast('数据导入成功');
  }catch(e){toast('文件格式不正确，导入失败',true);}
 });
}
function doReset(){confirmDlg('将清空当前所有数据并恢复为内置示例数据，建议先导出备份。确定继续？',()=>{resetDB();render();toast('已重置为示例数据');});}

/* ============== 启动 ============== */
DB=loadDB();
if(!location.hash)location.hash='#/dashboard';
render();
</script>
</body>
